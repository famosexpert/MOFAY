<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOSES O FAYELE | Technology & Digital Solutions</title>
<meta name="description" content="Portfolio of Moses O Fayele: web design, graphic design, networking, AI tools and IT support. Ideas into Digital Solutions.">
<meta property="og:title" content="MOSES O FAYELE | Technology & Digital Solutions"><meta property="og:type" content="website">
<meta name="theme-color" content="#0b1f3a">
<style>
:root{--navy:#0b1f3a;--blue:#4a9fe0;--light:#e8f2fc;--soft:#f5f9fd;--muted:#4b5d75;--line:#dce8f5}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);background:#fff;line-height:1.65}
a{color:inherit;text-decoration:none}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}section{padding:84px 0}.alt{background:var(--soft)}
header{position:fixed;inset:0 0 auto;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;letter-spacing:.08em;font-size:.95rem}nav{display:flex;gap:26px}
nav a{font-size:.92rem;color:var(--muted);transition:color .2s}nav a:hover{color:var(--blue)}
.menu{display:none;background:none;border:0;color:var(--navy);cursor:pointer}
.hero{padding-top:140px}.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.14em;font-size:.82rem}
h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.1;margin:10px 0 18px;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.2;margin-bottom:14px}.lead{color:var(--muted);max-width:520px}
.btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:8px;font-weight:600;border:2px solid var(--navy);transition:.2s}
.btn.fill{background:var(--navy);color:#fff}.btn.fill:hover{background:#17345f}.btn.line:hover{background:var(--light)}
.photo{position:relative;aspect-ratio:4/5;max-width:380px;margin-left:auto;border-radius:16px;background:var(--light);display:grid;place-items:center;font-size:3rem;font-weight:800;color:var(--blue)}
.photo::before{content:"";position:absolute;inset:14px -14px -14px 14px;border:2px solid var(--blue);border-radius:16px;z-index:-1}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px}
.kicker{color:var(--blue);font-weight:700;letter-spacing:.12em;font-size:.8rem;margin-bottom:8px}
.about p{color:var(--muted);max-width:680px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(11,31,58,.09)}
.card .ic{width:46px;height:46px;border-radius:10px;background:var(--light);color:var(--navy);display:grid;place-items:center;margin-bottom:14px}
.card h3{font-size:1.05rem;margin-bottom:6px}.card p{color:var(--muted);font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chip{padding:10px 20px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:500;transition:.2s}.chip:hover{background:var(--light);border-color:var(--blue)}
.thumb{aspect-ratio:16/10;background:var(--light);border-radius:10px;margin-bottom:14px;display:grid;place-items:center;color:var(--blue);font-size:.85rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}.tag{font-size:.75rem;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}
.more{display:inline-block;margin-top:10px;font-weight:600;font-size:.9rem;border-bottom:2px solid var(--blue)}
.contact{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:32px;max-width:720px}
.social{display:flex;gap:10px;margin-top:26px}.social a{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center;font-weight:700;font-size:.85rem;transition:.2s}
.social a:hover{background:var(--navy);color:#fff}
footer{background:var(--navy);color:#cfe0f3;padding:40px 0;text-align:center;font-size:.9rem}
footer nav{justify-content:center;flex-wrap:wrap;margin:14px 0}footer nav a{color:#cfe0f3}footer .social{justify-content:center}footer .social a{border-color:#cfe0f3;color:#fff}footer .social a:hover{background:#fff;color:var(--navy)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.reveal.in{opacity:1;transform:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.photo{margin:0 14px 0 0;max-width:300px}.grid{grid-template-columns:1fr 1fr}
.menu{display:block}header nav{display:none;position:absolute;top:64px;left:0;right:0;background:#fff;flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
header nav.open{display:flex}header nav a{padding:14px 22px}}
@media(max-width:560px){.grid,.contact{grid-template-columns:1fr}section{padding:64px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
</style></head>
<body><div id="app"></div>
<script>
/* ===== EDIT YOUR CONTENT HERE (same data as the React version) ===== */
// ===== EDIT YOUR CONTENT HERE (one place) =====
const site = {
  name: "MOSES O FAYELE",
  title: "TECHNOLOGY & DIGITAL SOLUTIONS",
  headline: "Ideas into Digital Solutions.",
  intro: "I'm a technology enthusiast interested in building useful digital experiences, exploring emerging tools and solving everyday problems through technology.",
  photo: "photo.jpg", // put your portrait in /public as photo.jpg
  aboutTitle: "Driven by Curiosity. Focused on Solutions.",
  about: [
    "I am passionate about technology and the difference it can make in everyday life. My interests span web development, graphic design, computer networking, artificial intelligence, automation and IT support.",
    "I enjoy learning new tools, understanding how things work and turning ideas into practical digital solutions. I am committed to continuous learning and to growing my skills one project at a time."
  ],
  email: "fayelemoses@gmail.com",
  whatsappLabel: "+234 912 093 7093",
  whatsapp: "https://wa.me/2349120937093",
};
const nav = [["Home","home"],["About","about"],["Services","services"],["Skills","skills"],["Projects","projects"],["Contact","contact"]];
const icons = {
  web:"M16 18l6-6-6-6M8 6l-6 6 6 6", design:"M12 19l7-7 3 3-7 7zM2 2l7.6 7.6M18 13l-1.5-7.5L2 2l3.5 14.5z",
  net:"M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01",
  ai:"M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z", it:"M2 4h20v12H2zM8 20h8M12 16v4", zap:"M13 2L3 14h9l-1 8 10-12h-9z"
};
const services = [
  {icon:"web",title:"Web Design & Development",text:"Clean, responsive websites that are easy to use and quick to load."},
  {icon:"design",title:"Graphic Design",text:"Visual designs and layouts that communicate ideas clearly."},
  {icon:"net",title:"Computer Networking",text:"Exploring how devices connect, communicate and stay secure."},
  {icon:"ai",title:"AI & Automation",text:"Using AI tools and automation to save time and simplify tasks."},
  {icon:"it",title:"Software & IT Support",text:"Practical help with software, devices and everyday tech problems."},
  {icon:"zap",title:"Technology & Digital Solutions",text:"Turning everyday problems into simple, useful digital solutions."},
];
const skills = ["Web Design","HTML and CSS","Graphic Design","Computer Networking","Artificial Intelligence Tools","IT Support","Problem Solving","Digital Technology"];
const projects = [ // replace image with e.g. "projects/one.jpg" (put file in /public/projects)
  {title:"Project Title One",category:"Web Design",text:"Short description of this project. Replace with your own work.",image:"",link:"#projects"},
  {title:"Project Title Two",category:"Graphic Design",text:"Short description of this project. Replace with your own work.",image:"",link:"#projects"},
  {title:"Project Title Three",category:"AI & Automation",text:"Short description of this project. Replace with your own work.",image:"",link:"#projects"},
];
const socials = [
  {name:"Facebook",short:"f",url:"https://facebook.com/mosesofayele"},
  {name:"Instagram",short:"ig",url:"https://instagram.com/mosesofayele"},
  {name:"TikTok",short:"tt",url:"https://tiktok.com/@mosesofayele"},
  {name:"LinkedIn",short:"in",url:"https://linkedin.com/in/mosesofayele"},
];
/* ===== RENDERING (no need to edit) ===== */
const ic=d=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const soc=()=>`<div class="social">${socials.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer" aria-label="${s.name}">${s.short}</a>`).join("")}</div>`;
const sec=(id,alt,k,t,c)=>`<section id="${id}" class="${alt?"alt":""}"><div class="wrap reveal"><div class="kicker">${k}</div><h2>${t}</h2>${c}</div></section>`;
const links=()=>nav.map(([l,id])=>`<a href="#${id}">${l}</a>`).join("");
document.getElementById("app").innerHTML=`
<header><div class="wrap"><a href="#home" class="logo">MOF</a>
<button class="menu" aria-label="Toggle menu" aria-expanded="false">${ic("M3 6h18M3 12h18M3 18h18")}</button><nav id="nav">${links()}</nav></div></header>
<main><section id="home" class="hero"><div class="wrap"><div><div class="eyebrow">${site.title}</div><h1>${site.name}</h1>
<p style="font-size:1.4rem;font-weight:600">${site.headline}</p><p class="lead" style="margin-top:12px">${site.intro}</p>
<div class="btns"><a class="btn fill" href="#projects">Explore My Work</a><a class="btn line" href="#contact">Contact Me</a></div></div>
<div class="photo">MF<img src="${site.photo}" alt="Portrait of ${site.name}" width="380" height="475" onerror="this.style.display='none'"></div></div></section>
${sec("about",1,"ABOUT ME",site.aboutTitle,`<div class="about">${site.about.map(p=>`<p>${p}</p>`).join("")}</div>`)}
${sec("services",0,"SERVICES & INTERESTS","What I Work On",`<div class="grid">${services.map(s=>`<div class="card"><div class="ic">${ic(icons[s.icon])}</div><h3>${s.title}</h3><p>${s.text}</p></div>`).join("")}</div>`)}
${sec("skills",1,"SKILLS & LEARNING","Always Learning",`<div class="chips">${skills.map(s=>`<span class="chip">${s}</span>`).join("")}</div>`)}
${sec("projects",0,"PORTFOLIO","Selected Projects",`<div class="grid">${projects.map(p=>`<div class="card"><div class="thumb">${p.image?`<img src="${p.image}" alt="${p.title}" loading="lazy">`:"Project image placeholder"}</div><div class="tag">${p.category}</div><h3>${p.title}</h3><p>${p.text}</p><a class="more" href="${p.link}">View details</a></div>`).join("")}</div>`)}
${sec("contact",1,"CONTACT","Let's Talk",`<p class="lead">Have an idea or a question? Reach out on any of these.</p><div class="contact"><a class="card" href="mailto:${site.email}"><h3>Email</h3><p>${site.email}</p></a><a class="card" href="${site.whatsapp}" target="_blank" rel="noopener noreferrer"><h3>WhatsApp</h3><p>${site.whatsappLabel}</p></a></div>${soc()}`)}
</main><footer><div class="wrap"><nav>${links()}</nav>${soc()}<p style="margin-top:18px">© 2026 ${site.name}. All Rights Reserved.</p></div></footer>`;
const n=document.getElementById("nav"),m=document.querySelector(".menu");
m.onclick=()=>{m.setAttribute("aria-expanded",n.classList.toggle("open"))};n.onclick=()=>n.classList.remove("open");
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script></body></html>
