<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOSES O FAYELE | Technology & Digital Solutions</title>
<meta name="description" content="Portfolio of Moses O Fayele: web design, graphic design, networking, AI tools and IT support. Ideas into Digital Solutions.">
<meta property="og:title" content="MOSES O FAYELE | Technology & Digital Solutions"><meta property="og:type" content="website">
<meta name="theme-color" content="#0b1f3a">
<style>
:root{--navy:#0b1f3a;--blue:#4a9fe0;--light:#e8f2fc;--soft:#f5f9fd;--muted:#4b5d75;--line:#dce8f5}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);background:#fff;line-height:1.65}
a{color:inherit;text-decoration:none}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}section{padding:84px 0}.alt{background:var(--soft)}
header{position:fixed;inset:0 0 auto;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;letter-spacing:.08em;font-size:.95rem}nav{display:flex;gap:26px}
nav a{font-size:.92rem;color:var(--muted);transition:color .2s}nav a:hover{color:var(--blue)}
.menu{display:none;background:none;border:0;color:var(--navy);cursor:pointer}
.hero{padding-top:140px}.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.14em;font-size:.82rem}
h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.1;margin:10px 0 18px;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.2;margin-bottom:14px}.lead{color:var(--muted);max-width:520px}
.btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:8px;font-weight:600;border:2px solid var(--navy);transition:.2s}
.btn.fill{background:var(--navy);color:#fff}.btn.fill:hover{background:#17345f}.btn.line:hover{background:var(--light)}
.photo{position:relative;aspect-ratio:4/5;max-width:380px;margin-left:auto;border-radius:16px;background:var(--light);display:grid;place-items:center;font-size:3rem;font-weight:800;color:var(--blue)}
.photo::before{content:"";position:absolute;inset:14px -14px -14px 14px;border:2px solid var(--blue);border-radius:16px;z-index:-1}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px}
.kicker{color:var(--blue);font-weight:700;letter-spacing:.12em;font-size:.8rem;margin-bottom:8px}
.about p{color:var(--muted);max-width:680px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(11,31,58,.09)}
.card .ic{width:46px;height:46px;border-radius:10px;background:var(--light);color:var(--navy);display:grid;place-items:center;margin-bottom:14px}
.card h3{font-size:1.05rem;margin-bottom:6px}.card p{color:var(--muted);font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chip{padding:10px 20px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:500;transition:.2s}.chip:hover{background:var(--light);border-color:var(--blue)}
.thumb{aspect-ratio:16/10;background:var(--light);border-radius:10px;margin-bottom:14px;display:grid;place-items:center;color:var(--blue);font-size:.85rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}.tag{font-size:.75rem;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}
.more{display:inline-block;margin-top:10px;font-weight:600;font-size:.9rem;border-bottom:2px solid var(--blue)}
.contact{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:32px;max-width:720px}
.social{display:flex;gap:10px;margin-top:26px}.social a{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center;font-weight:700;font-size:.85rem;transition:.2s}
.social a:hover{background:var(--navy);color:#fff}
footer{background:var(--navy);color:#cfe0f3;padding:40px 0;text-align:center;font-size:.9rem}
footer nav{justify-content:center;flex-wrap:wrap;margin:14px 0}footer nav a{color:#cfe0f3}footer .social{justify-content:center}footer .social a{border-color:#cfe0f3;color:#fff}footer .social a:hover{background:#fff;color:var(--navy)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.reveal.in{opacity:1;transform:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.photo{margin:0 14px 0 0;max-width:300px}.grid{grid-template-columns:1fr 1fr}
.menu{display:block}header nav{display:none;position:absolute;top:64px;left:0;right:0;background:#fff;flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
header nav.open{display:flex}header nav a{padding:14px 22px}}
@media(max-width:560px){.grid,.contact{grid-template-columns:1fr}section{padding:64px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
.about-grid{display:grid;grid-template-columns:300px 1fr;gap:56px;align-items:center;margin-top:28px}
.about-grid .photo{margin:0 14px 0 0;max-width:300px;width:100%}.about-grid .about p:first-child{margin-top:0}
@media(max-width:820px){.about-grid{grid-template-columns:1fr;gap:36px}.about-grid .photo{margin:0 14px 0 0}}
.social{flex-wrap:wrap}.social a{width:auto;height:auto;border-radius:999px;padding:10px 18px;gap:10px;display:inline-flex;align-items:center;font-size:.95rem}
.social svg{width:20px;height:20px}.photo img{object-position:center top}
.hero-art{max-width:420px;width:100%;margin-left:auto}.hero-art svg{display:block;width:100%;height:auto;stroke:none;fill:none}
@media(max-width:820px){.hero-art{margin:0 auto;max-width:340px}}
</style></head>
